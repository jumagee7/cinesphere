<!DOCTYPE html>
<html lang="en" spellcheck="false">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vyro — premium movie &amp; TV streaming with Trakt integration.">

  <!-- Google Sign-In (web) — OAuth client ID (client_type 3 WEB from google-services.json).
       The google_sign_in_web plugin auto-detects this meta tag during bootstrap
       to initialize the Google Identity Services SDK. -->
  <meta name="google-signin-client_id"
        content="190184825728-15flv3a0pt8ubcm83trsud0unspjuo68.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vyro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vyro</title>
  <link rel="manifest" href="manifest.json">

  <!-- Prevent browser spellcheck / grammar-extension underlines (e.g. Grammarly)
       from marking Flutter web's exposed-semantics text layer as editable.
       Those extensions paint yellow/red wavy underlines over the accessible DOM
       nodes Flutter renders for screen readers, which is not app content. -->
  <meta name="google" content="notranslate">
  <style>
    /* Neutralize third-party inline grammar/spellcheck decorations in semantics. */
    flt-glass-pane [aria-label],
    .flt-text-span,
    #flt-semantics * {
      text-decoration: none !important;
    }
  </style>
</head>
<body spellcheck="false" data-gramm="false" data-gramm_editor="false">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
